name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build macOS App Release
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "error: VERSION ($VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Tag Points At Origin Main
        run: |
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Workspace Guard
        run: ./script/check_workspace_guard.sh --dev

      - name: Release Hygiene
        run: ./script/check_release_hygiene.sh

      - name: Package App Bundle
        run: |
          bash Sources/AnnualMeetingSwitcher/build_v33.sh
          APP_BUNDLE="dist/LiveSwitcher.app"
          ZIP_NAME="LiveSwitcher-macOS-${{ github.ref_name }}.zip"

          if [ ! -x "$APP_BUNDLE/Contents/MacOS/LiveSwitcher" ]; then
            echo "error: packaged app not found at $APP_BUNDLE" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$APP_BUNDLE"
          (cd dist && zip -r "../$ZIP_NAME" LiveSwitcher.app)
          ls -lh "$ZIP_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LiveSwitcher ${{ github.ref_name }}"
          body: |
            ## LiveSwitcher ${{ github.ref_name }}

            Public source-available macOS build.

            ### Install
            Download `LiveSwitcher-macOS-${{ github.ref_name }}.zip`, unzip it, and move `LiveSwitcher.app` to `/Applications`.

            The app is ad-hoc signed and not notarized. macOS may require opening it from System Settings → Privacy & Security → Open Anyway.
          files: LiveSwitcher-macOS-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
