name: Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  swiftpm-smoke-tests:
    name: SwiftPM Smoke Tests
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift Version
        run: swift --version

      - name: Workspace Guard
        run: ./script/check_workspace_guard.sh --dev

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Diff Check
        run: git diff --check

      - name: Workspace Guard Tests
        run: ./script/test_workspace_guard.sh

      - name: Release Hygiene
        run: ./script/check_release_hygiene.sh

      - name: Release Hygiene Fallback PATH
        run: PATH=/usr/bin:/bin:/usr/sbin:/sbin ./script/check_release_hygiene.sh

      - name: Package App Bundle
        run: bash Sources/AnnualMeetingSwitcher/build_v33.sh

      - name: Lint App Info.plist
        run: plutil -lint dist/LiveSwitcher.app/Contents/Info.plist

      - name: Verify App Signature
        run: codesign --verify --deep --strict dist/LiveSwitcher.app
