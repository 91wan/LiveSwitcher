name: Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  swiftpm-smoke-tests:
    name: SwiftPM Smoke Tests
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift Version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Diff Check
        run: git diff --check

      - name: Release Hygiene
        run: ./script/check_release_hygiene.sh
